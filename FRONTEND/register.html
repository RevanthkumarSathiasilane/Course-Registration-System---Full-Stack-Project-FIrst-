<!DOCTYPE html>
<html lang="en">
<head>
  <title>Register a Course</title>
</head>
<body>
  <h1 style="color:yellow">Kickstart with an exciting course</h1>
  <form>
    <label for="name">Enter your name:</label><br>
    <input type="text" name = "name"><br><br>

    <label for="email">Enter your email:</label><br>
    <input type="email" name = "emailId"><br><br>

    <label for="course">Choose a Course</label><br>
    <select id="course" name = "courseName"><br><br>
      <option value="Java Essentials">Java Essentials</option>
      <option value="Python for ML">Python for ML</option>
      <option value="Spring Boot">Spring Boot</option>
    </select>
  </form>
  <br>
  <br>
  <button type="submit">Submit</button>
</body>
</html>
